  meraki-ms350-48lp:
    - prefix: "GigabitEthernet1/"
      count: 48
      speed: 1000000000
      interface_type: "Physical"
      port_mode: "access"
    - prefix: "TenGigabitEthernet1/"
      count: 4
      speed: 10000000000
      interface_type: "Physical"
      port_mode: "trunk"
      is_wan: true
  meraki-ms250-48lp:
