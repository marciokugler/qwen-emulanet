# ---------------------------------------------------------------------------
# Physical topology. `source`/`target` name a device hostname and one of its
# interface names; the loader resolves each to that interface's UUID, which is
# what physical-topology emits as startPortID/endPortID. An unresolved name is
# a load-time error, because NI silently drops an edge whose port IDs do not
# match an interface vertex.
#
# Ports are NOT cabled by default: a profile expands to every port on the
# chassis, and only the ones named here are UP. An uncabled port reporting UP
# would make NI infer adjacency that does not exist.
# ---------------------------------------------------------------------------
links:
  # HQ: edge router into the core pair, core peer link, core to access.
  - source: {device: "HQ-ISR4431-Edge-01", port: "TenGigabitEthernet0/0/1"}
    target: {device: "HQ-C9500-Core-01", port: "HundredGigE1/0/1"}
  - source: {device: "HQ-ISR4431-Edge-01", port: "TenGigabitEthernet0/0/2"}
    target: {device: "HQ-C9500-Core-02", port: "HundredGigE1/0/1"}
