# Northwind Retail Group — Catalyst Center (DNAC) estate
#
# The same fictional company as config/topology.yaml, but the part of the
# network managed by Cisco Catalyst Center rather than the Meraki dashboard:
# the campus core, the data centre fabric, and one regional office.
#
# Two systems, one estate. HQ is modelled in BOTH: three Meraki switches are
# mid-migration and were discovered by Catalyst Center over SNMP, so they
# carry the same serial and MAC in each system. Splunk NI joins device
# vertices on serial/MAC, so those three fuse into one vertex whose
# source_systems lists both — the consolidation story the demo tells.
#
# Business context is carried only through fields the real DNAC API exposes:
# hostname, platformId, family, role, site hierarchy, interface names.

controller:
  # Reported by /dna/intent/api/v1/dnac-release and used for version gating.
  release: "3.1.3.0"
  name: "northwind-cc-01"
  # Every DNAC UUID in this file is derived deterministically from this
  # namespace so interface UUIDs are stable across restarts. The physical
  # topology links reference interfaces by UUID, and NI drops an edge whose
  # startPortID/endPortID do not match a known interface vertex.
  uuid_namespace: "6f1c1f6e-2a55-4c3f-9d21-4e7a0b5c1d99"

# ---------------------------------------------------------------------------
# Site hierarchy. DNAC sites are a tree: global -> area -> building -> floor.
# nameHierarchy is derived by the loader from `parent`, never written by hand.
# A device's `site` field must match a building or floor NAME exactly — NI
# resolves site_id_type="site_name" and an unmatched string orphans the device.
# ---------------------------------------------------------------------------
sites:
  - name: "Global"
    type: "global"

  - name: "HQ Campus"
    type: "area"
    parent: "Global"
    latitude: 47.6091
    longitude: -122.3390

  - name: "HQ-Seattle"
    type: "building"
    parent: "HQ Campus"
    address: "1201 3rd Ave, Seattle, WA 98101"
    latitude: 47.60975
    longitude: -122.33708
    country: "United States"

  - name: "Floor 1"
    type: "floor"
    parent: "HQ-Seattle"
    floor_number: 1
    rf_model: "Cubes And Workstations"
    width: 60
    length: 40
    height: 3

  - name: "Floor 2"
    type: "floor"
    parent: "HQ-Seattle"
    floor_number: 2
    rf_model: "Cubes And Workstations"
    width: 60
    length: 40
    height: 3

  - name: "Data Hall"
    type: "floor"
    parent: "HQ-Seattle"
    floor_number: -1
    rf_model: "Indoor High Ceiling"
    width: 30
    length: 20
    height: 5

  - name: "Data Centre"
    type: "area"
    parent: "Global"
    latitude: 39.5296
    longitude: -119.8138

  - name: "DC-Reno"
    type: "building"
