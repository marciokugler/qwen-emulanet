# ---------------------------------------------------------------------------
# Interface templates. A profile expands into concrete interfaces, each with a
# stable UUID (derived from device UUID + ifIndex) and an ifIndex. The loader
# assigns ifIndex sequentially within a device, so profiles only declare the
# name pattern, count, speed and role of each group.
#
#   is_wan: true  -> NI marks the interface entity_subtype "uplink" and grades
#                    a disconnected WAN interface critical, exactly as it does
#                    for a Meraki isUplink port. Only set on real uplinks.
# ---------------------------------------------------------------------------
port_profiles:
  # Campus core / DC spine: dense 25G access side, 100G fabric uplinks.
  c9500-48y4c:
    - prefix: "TwentyFiveGigE1/0/"
      count: 48
      speed: 25000000000
      interface_type: "Physical"
      port_mode: "trunk"
    - prefix: "HundredGigE1/0/"
      count: 4
      speed: 100000000000
      interface_type: "Physical"
      port_mode: "trunk"
      is_wan: true
  c9500-32c:
    - prefix: "HundredGigE1/0/"
      count: 32
      speed: 100000000000
      interface_type: "Physical"
      port_mode: "trunk"
      is_wan: true
  # Access switch: 48 PoE access ports, 4 uplinks.
  c9300-48uxm:
    - prefix: "GigabitEthernet1/0/"
      count: 48
      speed: 1000000000
      interface_type: "Physical"
      port_mode: "access"
    - prefix: "TenGigabitEthernet1/1/"
      count: 4
      speed: 10000000000
      interface_type: "Physical"
      port_mode: "trunk"
      is_wan: true
  c9300-48p:
    - prefix: "GigabitEthernet1/0/"
      count: 48
      speed: 1000000000
      interface_type: "Physical"
      port_mode: "access"
    - prefix: "TenGigabitEthernet1/1/"
      count: 4
      speed: 10000000000
      interface_type: "Physical"
      port_mode: "trunk"
      is_wan: true
  c9300-24p:
    - prefix: "GigabitEthernet1/0/"
      count: 24
      speed: 1000000000
      interface_type: "Physical"
      port_mode: "access"
    - prefix: "TenGigabitEthernet1/1/"
      count: 4
      speed: 10000000000
      interface_type: "Physical"
      port_mode: "trunk"
      is_wan: true
  # Industrial Ethernet switch in the warehouse: 8 PoE + 2 SFP uplinks.
  ie3400-8p2s:
    - prefix: "GigabitEthernet1/"
      count: 8
      speed: 1000000000
      interface_type: "Physical"
      port_mode: "access"
    - prefix: "TenGigabitEthernet1/"
      count: 2
      speed: 10000000000
      interface_type: "Physical"
      port_mode: "trunk"
      is_wan: true
  # Routers: LAN side plus a real WAN uplink.
  isr4431:
    - prefix: "GigabitEthernet0/0/"
      count: 4
      speed: 1000000000
      interface_type: "Physical"
      port_mode: "access"
    - prefix: "TenGigabitEthernet0/0/"
      count: 2
      speed: 10000000000
      interface_type: "Physical"
      port_mode: "trunk"
      is_wan: true
  isr4331:
    - prefix: "GigabitEthernet0/0/"
      count: 3
      speed: 1000000000
      interface_type: "Physical"
      port_mode: "access"
      is_wan: true
  isr4321:
    - prefix: "GigabitEthernet0/0/"
      count: 2
      speed: 1000000000
      interface_type: "Physical"
      port_mode: "access"
      is_wan: true
  # Wireless: controller and APs are small-port devices.
  c9800-80:
    - prefix: "TenGigabitEthernet1/"
      count: 2
      speed: 10000000000
      interface_type: "Physical"
      port_mode: "trunk"
      is_wan: true
  c9120-ap:
    - prefix: "GigabitEthernet0/0/"
      count: 1
      speed: 1000000000
      interface_type: "Physical"
      port_mode: "access"
      is_wan: true
  # Meraki switches discovered over SNMP during migration. Catalyst Center
  # reports them with their real Meraki serial and MAC; interface names are
