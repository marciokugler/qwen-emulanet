server:
  host: "0.0.0.0"
  port: 5000
  api_key: "6789123456789012345678901234567890123456"
  base_url: "http://localhost:5000"

catalyst:
  enabled: true
  host: "0.0.0.0"
  # Catalyst Center API. Separate port from the Meraki API because the add-on
  # treats the host as a controller and validates that it is https://.
  port: 5001
  topology_file: "config/catalyst_topology.yaml"
  username: "northwind_admin"
  password: "Emulanet2026!"
  token_ttl_seconds: 3600

dashboard:
  host: "0.0.0.0"
  # Avoid 8080 on Windows: wslrelay.exe often forwards a WSL app to
  # 127.0.0.1:8080, which shadows a 0.0.0.0:8080 bind for localhost requests.
  port: 8081

splunk_hec:
  enabled: false
  # Must be https:// — Splunk enables SSL on HEC by default
  # (enableSplunkHTTPSSL=true). Plain http to 8088 fails with
  # "connection reset by peer". Leave verify_ssl false for self-signed certs.
  url: "https://your-splunk:8088/services/collector"
  token: "your-hec-token-here"
  index: "main"
  verify_ssl: false

webhooks:
  enabled: true
  interval_seconds: 30
  shared_secret: "meraki-webhook-secret-12345"

data_generation:
  device_status_interval: 60
  client_stats_interval: 120
  vpn_stats_interval: 180
  sensor_readings_interval: 300
  events_interval: 45

scenarios:
  enabled: true
  config_file: "config/scenarios.yaml"

logging:
  level: "INFO"
  file: "logs/emulator.log"
