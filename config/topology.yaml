# ---------------------------------------------------------------------------
# Stores 0117, 0203, 0288, 0351, 0429 share one structural template so the
# demo shows a repeatable site pattern — which is how retail chains deploy.
# The loader expands store_template x stores into full networks, links, clients.
# ---------------------------------------------------------------------------
store_template:
  devices:
    - role: gateway
      name_suffix: "Gateway"
      model: "MX68"
      notes: "Store edge gateway. SD-WAN spoke to HQ hub. PCI DSS boundary for POS lanes."
      tags: ["branch-gateway", "sdwan-spoke", "pci-scope"]
      ip_suffix: "99.10"
    - role: switch
      name_suffix: "Switch"
      model: "MS250-24"
      notes: "Store access switch. Serves POS lanes, registers, APs, and cameras."
      tags: ["access-switch", "pci-scope", "pos-lane"]
      ip_suffix: "99.20"
    - role: ap_sales
      name_suffix: "AP-SalesFloor"
      model: "MR36"
      notes: "Sales floor coverage. Broadcasts Northwind-Guest and Northwind-Scanning."
      tags: ["guest-wifi", "scanner-wifi", "ceiling-mount", "sales-floor"]
      ip_suffix: "50.31"
    - role: ap_back
      name_suffix: "AP-BackOffice"
      model: "MR26"
      notes: "Back office coverage for associate workstations and inventory handhelds."
      tags: ["associate-wifi", "inventory", "ceiling-mount", "back-office"]
      ip_suffix: "10.32"
    - role: cam_entrance
      name_suffix: "Cam-Entrance"
      model: "MV22"
      notes: "Foot traffic counting and entrance loss prevention."
      tags: ["loss-prevention", "ceiling-mount", "people-counting", "sales-floor"]
      ip_suffix: "60.41"
    - role: cam_pos
      name_suffix: "Cam-POSLanes"
      model: "MV22"
      notes: "Register transaction monitoring. Retention 90 days for PCI DSS audit."
      tags: ["loss-prevention", "pci-scope", "ceiling-mount", "pos-lane"]
      ip_suffix: "60.42"
    - role: cam_stock
      name_suffix: "Cam-Stockroom"
      model: "MV12"
      notes: "Shrink investigation and receiving verification."
      tags: ["loss-prevention", "wall-mount", "stockroom", "inventory"]
      ip_suffix: "60.43"
    - role: sensor
      name_suffix: "Sensor-Closet"
      model: "MT20"
      notes: "Closet temperature. Alerts above 32C — equipment protection."
      tags: ["building-iot", "environmental", "back-office"]
      ip_suffix: "70.51"

  # Port assignments for the template links, keyed by target role.
  link_ports:
    gateway_to_switch: {source_port: "port 1", target_port: "23", trunk: true}
    switch_to_ap_sales: {source_port: "1", target_port: "eth0", vlan: 50}
    switch_to_ap_back: {source_port: "2", target_port: "eth0", vlan: 10}
    switch_to_cam_entrance: {source_port: "10", target_port: "eth0", vlan: 60}
    switch_to_cam_pos: {source_port: "11", target_port: "eth0", vlan: 60}
    switch_to_cam_stock: {source_port: "12", target_port: "eth0", vlan: 60}
    switch_to_sensor: {source_port: "16", target_port: "port 1", vlan: 70}

  clients:
    - role: pos_1
      hostname_suffix: "POS-LANE-01"
      description: "Register 1 payment terminal"
      ip_suffix: "30.11"
      vlan: 30
      client_type: "pos"
      attach_to: switch
      business_function: "POS — card-present transactions, PCI DSS scope"
    - role: pos_2
      hostname_suffix: "POS-LANE-02"
      description: "Register 2 payment terminal"
      ip_suffix: "30.12"
      vlan: 30
      client_type: "pos"
      attach_to: switch
      business_function: "POS — card-present transactions, PCI DSS scope"
    - role: scanner_1
      hostname_suffix: "SCAN-01"
      description: "Sales floor inventory handheld"
      ip_suffix: "40.101"
      vlan: 40
      client_type: "scanner"
      attach_to: ap_sales
      business_function: "Inventory — cycle counts and price audits"
    - role: guest_1
      hostname_suffix: "GUEST-CUSTOMER-01"
      description: "Customer smartphone"
      ip_suffix: "50.101"
      vlan: 50
      client_type: "guest"
      attach_to: ap_sales
      business_function: "Guest — customer internet, captive portal"
    - role: guest_2
      hostname_suffix: "GUEST-CUSTOMER-02"
      description: "Customer smartphone"
      ip_suffix: "50.102"
      vlan: 50
      client_type: "guest"
      attach_to: ap_sales
      business_function: "Guest — customer internet, captive portal"
    - role: associate_1
      hostname_suffix: "MGR-WS"
      description: "Store manager workstation"
      ip_suffix: "10.101"
      vlan: 10
      client_type: "associate"
      attach_to: ap_back
      business_function: "Store management — scheduling and payroll"
    - role: iot_1
      hostname_suffix: "HVAC-CTRL"
      description: "Rooftop HVAC controller"
      ip_suffix: "70.80"
      vlan: 70
      client_type: "iot"
      attach_to: switch
      business_function: "Facilities — HVAC and energy management"

