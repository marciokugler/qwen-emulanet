# Northwind Retail Group — Meraki topology
# Modeled per Cisco Meraki best practice: one organization, one network per physical site.
# Business context is carried only by fields the real Meraki API exposes:
#   device name, tags, notes, address, VLAN names, SSID names, network name.
# Tag convention follows Meraki guidance: lowercase, hyphenated, no spaces or commas,
# combining a geographic dimension with a functional dimension.

organization:
  id: "2947"
  name: "Northwind Retail Group"
  url: "https://n43.meraki.com/Northwind-Retail/o/2947/manage"

# ---------------------------------------------------------------------------
# VLAN template — business function is expressed through VLAN names.
# The same taxonomy is applied per site so Splunk can correlate across stores.
# ---------------------------------------------------------------------------
vlan_template:
  - id: 10
    name: "Corporate"
    purpose: "Associate workstations, back-office systems"
  - id: 20
    name: "VoIP"
    purpose: "Store phones, paging, intercom"
  - id: 30
    name: "POS-PCI"
    purpose: "Payment terminals — PCI DSS cardholder data environment"
  - id: 40
    name: "Inventory"
    purpose: "Handheld barcode scanners, RFID readers, receiving"
  - id: 50
    name: "Guest-WiFi"
    purpose: "Customer internet access, captive portal"
  - id: 60
    name: "Security-Cameras"
    purpose: "Loss prevention video surveillance"
  - id: 70
    name: "Building-IoT"
    purpose: "HVAC, lighting, refrigeration controllers"
  - id: 99
    name: "Management"
    purpose: "Out-of-band device management"

# ---------------------------------------------------------------------------
# SSID template — business function expressed through SSID names.
# ---------------------------------------------------------------------------
ssid_template:
  - number: 0
    name: "Northwind-Corp"
    auth_mode: "802.1x-radius"
    vlan_id: 10
    purpose: "Associates and corporate staff"
    visible: true
  - number: 1
    name: "Northwind-Guest"
    auth_mode: "open-with-splash"
    vlan_id: 50
    purpose: "Customer internet, click-through captive portal"
    visible: true
  - number: 2
    name: "Northwind-VoIP"
    auth_mode: "psk"
    vlan_id: 20
    purpose: "WiFi handsets and paging"
    visible: false
  - number: 4
    name: "Northwind-Scanning"
    auth_mode: "psk"
    vlan_id: 40
    purpose: "Inventory handhelds and RFID sleds"
    visible: false

